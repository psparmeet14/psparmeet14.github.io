<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Redirecting…</title>
    <script>
      // Old multi-page URLs land on the matching section of the single page.
      var sections = {
        about: 'now',
        experience: 'experience',
        projects: 'work',
        posts: 'writing',
        books: 'now',
        interests: 'now',
        contact: 'contact',
      }
      var key = location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase()
      location.replace('/' + (sections[key] ? '#' + sections[key] : ''))
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
